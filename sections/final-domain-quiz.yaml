questions:
- id: ats082-final-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Compute a completion rate with the right denominator
  source_readings:
  - sections/section-010/module-01/course-01-task-outcomes-populations-and-denominators.md
  prompt: A task was started by 120 users and finished by 90. What is the completion
    rate?
  options:
  - id: a
    text: 90 percent.
    explanation: This ignores the denominator and reads the count as a percentage.
  - id: b
    text: 75 percent.
    explanation: Correct. 90 divided by 120.
  - id: c
    text: 25 percent.
    explanation: This is the share who did not finish.
  - id: d
    text: 133 percent.
    explanation: This divides started by finished.
  correct_option: b
  explanation: 90 divided by 120.
- id: ats082-final-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain survivorship bias
  source_readings:
  - sections/section-010/module-01/course-02-time-to-complete-percentiles-and-survivorship.md
  prompt: Why can the median time of finished attempts look better after users start
    to give up?
  options:
  - id: a
    text: Users who gave up are not in the data, so the remaining attempts are the
      fast ones.
    explanation: Correct. The data keeps only the survivors.
  - id: b
    text: Giving up makes every remaining attempt faster.
    explanation: The remaining attempts do not change. The group that is measured
      changes.
  - id: c
    text: A median always falls when the count falls.
    explanation: The median does not depend on the count in this way.
  - id: d
    text: Finished attempts are measured with a different clock.
    explanation: The clock is the same. The population is different.
  correct_option: a
  explanation: The data keeps only the survivors.
- id: ats082-final-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Read evidence of developer experience together
  source_readings:
  - sections/section-010/module-02/course-01-quantitative-and-qualitative-evidence-of-developer-experience.md
  prompt: Which combination best explains why a platform feels slow to users when
    the counts look good?
  options:
  - id: a
    text: A rising count of API calls alone.
    explanation: A rising count shows usage and does not explain how the experience
      feels.
  - id: b
    text: A drop in tickets alone.
    explanation: A drop can mean that users gave up.
  - id: c
    text: The number of commits per developer.
    explanation: This is an activity count and does not describe flow.
  - id: d
    text: Interviews that report waiting on approvals, next to flat completion rates.
    explanation: Correct. Qualitative evidence explains the cause, and the rate shows
      the size.
  correct_option: d
  explanation: Qualitative evidence explains the cause, and the rate shows the size.
- id: ats082-final-q04
  type: single_choice
  difficulty: advanced
  learning_objective: Name a confounder
  source_readings:
  - sections/section-010/module-02/course-02-incentives-context-and-causation.md
  prompt: A platform template is released and onboarding time falls. In the same month
    the company hires many experienced engineers. What is the hiring in this comparison?
  options:
  - id: a
    text: The control group.
    explanation: A control group does not receive the change. The hiring affects the
      same people.
  - id: b
    text: The denominator.
    explanation: The denominator is the count that a rate divides by.
  - id: c
    text: A confounder, because it can produce the same fall in onboarding time.
    explanation: Correct. A confounder is another change in the same period that could
      explain the result.
  - id: d
    text: The target.
    explanation: A target is a value a team aims for.
  correct_option: c
  explanation: A confounder is another change in the same period that could explain
    the result.
- id: ats082-final-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Define the instability group
  source_readings:
  - sections/section-020/module-01/course-01-the-five-delivery-metrics.md
  prompt: Which statement about the instability group is correct?
  options:
  - id: a
    text: It holds lead time and frequency, which count speed.
    explanation: These are throughput metrics.
  - id: b
    text: It holds change fail rate and deployment rework rate, which count how often
      delivery goes wrong.
    explanation: Correct. The throughput group holds the other three metrics.
  - id: c
    text: It holds recovery time, which counts how long a failure lasts.
    explanation: Recovery time is a throughput metric in the current model.
  - id: d
    text: It holds the count of incidents in the organisation.
    explanation: The model counts deployments and their results, not all incidents.
  correct_option: b
  explanation: The throughput group holds the other three metrics.
- id: ats082-final-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish failure and rework
  source_readings:
  - sections/section-020/module-01/course-01-the-five-delivery-metrics.md
  prompt: A deployment fixes a production incident that an earlier deployment caused.
    Which two metrics can count it?
  options:
  - id: a
    text: It counts as rework, and the earlier deployment counts toward the change
      fail rate if it needed intervention.
    explanation: Correct. Failure and rework are different sets of deployments.
  - id: b
    text: It counts only toward the change fail rate.
    explanation: The repair deployment is the unplanned rework that the rework rate
      counts.
  - id: c
    text: It counts toward deployment frequency only.
    explanation: It also counts toward frequency, and the rework rate counts it as
      well.
  - id: d
    text: It counts toward neither metric.
    explanation: Every production deployment counts toward frequency, and the repair
      counts as rework.
  correct_option: a
  explanation: Failure and rework are different sets of deployments.
- id: ats082-final-q07
  type: single_choice
  difficulty: advanced
  learning_objective: Compute a recovery median
  source_readings:
  - sections/section-020/module-01/course-02-computing-delivery-metrics-from-deployment-events.md
  prompt: Five failed deployments recovered in 20, 90, 35, 300 and 50 minutes. What
    is the median failed deployment recovery time?
  options:
  - id: a
    text: 99 minutes.
    explanation: 99 is the mean, pulled up by the 300-minute recovery.
  - id: b
    text: 35 minutes.
    explanation: 35 is the second value, not the middle one.
  - id: c
    text: 90 minutes.
    explanation: 90 is the fourth value, not the middle one.
  - id: d
    text: 50 minutes.
    explanation: Correct. The sorted values are 20, 35, 50, 90 and 300, and the middle
      one is 50.
  correct_option: d
  explanation: The sorted values are 20, 35, 50, 90 and 300, and the middle one is
    50.
- id: ats082-final-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Interpret an old MTTR panel
  source_readings:
  - sections/section-020/module-02/course-01-from-four-keys-to-five-metrics.md
  prompt: A dashboard panel named MTTR shows 12 minutes. The note says it averages
    the duration of every alert, including alerts that no deployment caused. Can it
    be trusted as failed deployment recovery time?
  options:
  - id: a
    text: Yes, because the name is similar.
    explanation: The name is not the definition.
  - id: b
    text: Yes, because 12 minutes is a low value.
    explanation: A low value does not make the definition match.
  - id: c
    text: No, because it does not start at a failed deployment and it uses a mean.
    explanation: Correct. The panel counts different events and a different statistic.
  - id: d
    text: No, because MTTR is not a delivery metric at all.
    explanation: The metric exists in the current model under a new name and a narrower
      definition.
  correct_option: c
  explanation: The panel counts different events and a different statistic.
- id: ats082-final-q09
  type: single_choice
  difficulty: advanced
  learning_objective: Report a mixed result
  source_readings:
  - sections/section-020/module-02/course-01-from-four-keys-to-five-metrics.md
  prompt: A service improved lead time and recovery time but its change fail rate
    rose from 10 to 20 percent. Which report is accurate?
  options:
  - id: a
    text: Delivery improved, so the fail rate is not worth reporting.
    explanation: Leaving out the worse metric hides a finding.
  - id: b
    text: Throughput metrics improved and the fail rate, an instability metric, worsened.
    explanation: Correct. The report states both groups and does not average them.
  - id: c
    text: Delivery is unchanged because the metrics cancel.
    explanation: The metrics are not added together.
  - id: d
    text: The recovery time proves the fail rate is correct.
    explanation: The two measure different things.
  correct_option: b
  explanation: The report states both groups and does not average them.
- id: ats082-final-q10
  type: single_choice
  difficulty: advanced
  learning_objective: Choose the scope and wording of a platform claim
  source_readings:
  - sections/section-020/module-02/course-02-service-scope-causal-limits-and-platform-initiatives.md
  prompt: Which statement about a platform initiative matches data from three services
    with a before-and-after comparison and one service outside the change?
  options:
  - id: a
    text: Both pipeline services shipped faster, one became less stable, one service
      outside the pipeline also improved, so the cause is not proven.
    explanation: Correct. It states what the data shows and what it does not show,
      per service.
  - id: b
    text: The platform made every team better.
    explanation: The word every and the causal claim are not supported.
  - id: c
    text: The organisation improved by an average of 40 percent.
    explanation: A blended score hides the differences between services.
  - id: d
    text: The platform had no effect.
    explanation: The data does not support a statement of no effect either.
  correct_option: a
  explanation: It states what the data shows and what it does not show, per service.
