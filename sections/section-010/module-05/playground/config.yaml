# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Platform Reliability Measures (PLAYGROUND). A clean sandbox: it starts a cluster and loads the
# source data, then stays running for free exploration. No task, no grading,
# no `astrona submit`. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-082-playground-010-05
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8

# What the learner starts with: namespace metrics with the ConfigMap service-events (four platform services with an SLO target and 30 days of good and total events) and the ConfigMap recent-hour (events of one service in the last hour). No report exists.
bootstrap:
  manifests:
    - name: data
      type: file
      source: manifests/data.yaml

teardown:
  keepCluster: false
