# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Weigh Developer Experience Evidence (LAB). Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-082-lab-010-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8

# Starting state: namespace metrics with four months of portal usage and tickets, 12 survey answers and a list of platform changes.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the namespace and the source data
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: usage-data-unchanged
      description: The usage data is unchanged
      type: file
      source: validation/validate-usage-data-unchanged.sh
      hint: Do not edit portal-usage. Write your results in a new ConfigMap.
    - name: survey-data-unchanged
      description: The survey data is unchanged
      type: file
      source: validation/validate-survey-data-unchanged.sh
      hint: Do not edit survey-responses.
    - name: ticket-counts
      description: tickets-before and tickets-after are recorded
      type: file
      source: validation/validate-ticket-counts.sh
      hint: Before is August and September, after is October and November. Add the tickets of each period.
    - name: completion-rates
      description: The completion rate before and after is recorded
      type: file
      source: validation/validate-completion-rates.sh
      hint: Divide total tasks completed by total sessions started in each period. Do not average the monthly percentages of unequal months.
    - name: top-survey-theme
      description: The most frequent survey theme is named
      type: file
      source: validation/validate-top-survey-theme.sh
      hint: Group the survey answers by theme and count them.
    - name: confounder-named
      description: The other change in the period is named
      type: file
      source: validation/validate-confounder-named.sh
      hint: Read platform-changes. One other change affects how many environments a team can create.
    - name: verdict
      description: The verdict follows from the evidence
      type: file
      source: validation/validate-verdict.sh
      hint: Tickets fell, but compare what happened to completed tasks before you call it an improvement. Use improved, worse or unclear.

teardown:
  keepCluster: false
